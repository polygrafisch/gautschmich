:root{color-scheme:light;--bg:#ffffff;--ink:#111111;--gut:#1a7f43;--rot:#c8312a;--d:#3a6aa8;--dt:#2f5c96;--l1:color-mix(in srgb,var(--ink) 15%,transparent)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.45 "TeX Gyre Heros","Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;hyphens:auto;-webkit-hyphens:auto}
main{max-width:50em;margin:0 auto;padding:clamp(28px,5vw,64px) max(5vw,16px) 48px}
h1{font-weight:700;font-size:clamp(2.2rem,6vw,3.25rem);line-height:1;letter-spacing:-.025em;margin:0}
.hint{opacity:.62;font-size:.875rem;line-height:1.4}
.top{padding-bottom:4px}
.prog{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.875rem}
.prog b{font-weight:700}
.bar{position:relative;height:1.5px;background:var(--l1);margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .35s ease}
.q{margin-top:clamp(28px,5vw,44px)}
.q h2{font-weight:700;font-size:clamp(1.35rem,3.4vw,1.75rem);line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance}
.fig{margin:22px 0 4px;color:var(--ink)}
.fig svg{display:block;width:100%;max-width:520px;height:auto}
.fig text{font:400 13px "TeX Gyre Heros",Helvetica,Arial,sans-serif;fill:currentColor}
ol.opts{list-style:none;margin:24px 0 0;padding:0;border-top:1.5px solid var(--ink)}
ol.opts li{border-bottom:1px solid var(--l1)}
ol.opts button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;width:100%;min-height:56px;padding:15px 0;cursor:pointer;color:var(--ink);font:inherit}
ol.opts button:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
ol.opts button:focus-visible{outline:none}
ol.opts button:focus-visible .t{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
ol.opts button:focus-visible .k{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
ol.opts .k{font-weight:700}
ol.opts .m{font-size:.875rem;font-weight:700;white-space:nowrap}
ol.opts button[disabled]{cursor:default}
ol.opts button[disabled]:hover .t{text-decoration:none}
ol.opts .dim{opacity:.4}
ol.opts .ok .t{font-weight:700}
ol.opts .no .t{text-decoration:line-through;text-decoration-thickness:1.5px}
ol.opts .no{opacity:.6}
.fb{margin-top:22px;padding-top:2px;scroll-margin-bottom:20px}
.fb p{margin:.3em 0 0}
.fb .v{font-weight:700;display:flex;align-items:center;gap:.45em}
.fb .v svg{width:1.35em;height:1.35em;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fb .v.gut{animation:gut 3.2s ease 0s 1 both}
.fb .v.rot{animation:rot 3.2s ease 0s 1 both}
@keyframes gut{0%,40%{color:var(--gut)}100%{color:var(--ink)}}
@keyframes rot{0%,40%{color:var(--rot)}100%{color:var(--ink)}}
.fb .v .zug{stroke-dasharray:16;stroke-dashoffset:16;animation:zug .45s ease-out .1s 1 forwards}
@keyframes zug{to{stroke-dashoffset:0}}
ol.opts .ok .m{color:var(--gut)}
ol.opts .no .m{color:var(--rot)}
.award{display:flex;align-items:center;gap:18px 22px;flex-wrap:wrap;margin-top:28px;padding:18px 0;border-top:1px solid var(--l1);border-bottom:1px solid var(--l1)}
.award svg{width:132px;height:132px;flex:none;color:var(--d);transform:rotate(-6deg);animation:stempel .55s cubic-bezier(.2,1.4,.4,1) .35s 1 both}
.award svg text{font:700 11px "TeX Gyre Heros",Helvetica,Arial,sans-serif;fill:var(--dt);letter-spacing:.02em}
.award b{font-size:1.25rem;letter-spacing:-.01em}
.award p{margin:.25em 0 0}
@keyframes stempel{0%{opacity:0;transform:scale(1.7) rotate(-18deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.shine{background:linear-gradient(105deg,var(--ink) 42%,color-mix(in srgb,var(--ink) 22%,var(--bg)) 50%,var(--ink) 58%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s cubic-bezier(.4,0,.2,1) .15s 1 both}
@keyframes shine{0%{background-position:100% 0;opacity:.25}25%{opacity:1}100%{background-position:0 0;opacity:1}}
.shine.again{animation:shine2 2.6s cubic-bezier(.4,0,.2,1) 0s 1 both}
@keyframes shine2{0%{background-position:100% 0}100%{background-position:0 0}}
.wait{display:flex;align-items:center;gap:14px;min-height:44px;margin-top:18px}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{display:block;width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:1.5}
.ring .tr{stroke:var(--l1)}
.ring .pr{stroke:var(--ink)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.875rem;font-weight:700;font-variant-numeric:tabular-nums}
.next{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;min-height:44px;margin-top:18px;font-weight:700;cursor:pointer;border-bottom:1.5px solid var(--ink);line-height:1.2}
.next:focus-visible{outline:none;border-bottom-width:3px}
.next+.next{margin-left:28px}
.res h2{font-weight:700;font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.03em;margin:0}
.res .sub{font-weight:700;font-size:1.25rem;margin:.5em 0 0;letter-spacing:-.01em}
.rev{list-style:none;margin:32px 0 0;padding:0;border-top:1.5px solid var(--ink)}
.rev li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:2px 10px;padding:14px 0;border-bottom:1px solid var(--l1)}
.rev .n{font-weight:700;font-variant-numeric:tabular-nums}
.rev .qq{font-weight:700}
.rev .a{grid-column:2}
.rev .wrong .qq{text-decoration:none}
.gm-kopf{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 20px;margin-bottom:clamp(22px,4vw,36px);padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.gm-kopf .kenn{margin:0;font-size:.9375rem;color:color-mix(in srgb,var(--ink) 62%,transparent)}
.gm-kopf .kenn b{display:inline-block;min-width:1.5em;margin-right:.35em;padding:.05em .4em;background:#3a6aa8;color:#fff;text-align:center;font-weight:700}
.gm-kopf .heim{font-size:.9375rem;font-weight:700;color:#2f5c96;background:#e5ecf4;padding:.3em .7em;text-decoration:none;white-space:nowrap}
.gm-kopf .heim:hover,.gm-kopf .heim:focus-visible{background:#3a6aa8;color:#fff;outline:none}
@media(min-width:601px){.gm-kopf{flex-wrap:nowrap}.gm-kopf .kenn{flex:1 1 auto}.gm-kopf .heim{flex:none}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}.shine{animation:none;background:none;color:inherit}.fb .v.gut,.fb .v.rot{animation:none}.fb .v.gut{color:var(--gut)}.fb .v.rot{color:var(--rot)}.fb .v .zug{animation:none;stroke-dashoffset:0}.award svg{animation:none}}
@media(max-width:600px){ol.opts button{grid-template-columns:1.8em minmax(0,1fr)}ol.opts .m{grid-column:2}}
</style>

const Q = [

 {q:"In der Maske gibt es einen Bereich mit 50 % Grau. Wie erscheint die Ebene dort?",fig:"maske",

 {q:"Du hast eine Auswahl um das Objekt. Wie machst du daraus am schnellsten eine Ebenenmaske?",
  a:["Im Ebenen-Bedienfeld auf «Ebenenmaske hinzufügen» klicken","Die Auswahl kopieren und als neue Ebene einfügen","Die Auswahl mit «Fläche füllen» schwarz füllen","Die Auswahl im Bedienfeld «Pfade» als Arbeitspfad sichern"],

 {q:"Du hast mit dem Zauberstab den einfarbigen Hintergrund ausgewählt und eine Maske erstellt. Jetzt ist nur noch der Hintergrund sichtbar. Was tust du, damit das Objekt und nicht der Hintergrund sichtbar wird?",
  a:["Die Maske umkehren, im Bedienfeld «Eigenschaften» oder mit Cmd/Ctrl+I","Die Maske löschen und das Objekt mit dem Lasso nachzeichnen","Die Deckkraft der Ebene auf 0 % stellen","Den Hintergrund auf der Bildebene mit dem Radiergummi entfernen"],
  e:"Das ist ein bewährter Weg: Den einfachen Hintergrund auswählen und danach umkehren. Das geht schon bei der Auswahl (Auswahl > Auswahl umkehren) oder nachträglich in der Maske."},
 {q:"Du willst nur die Ebenenmaske in Schwarz-Weiss sehen, um Löcher und unsaubere Ränder zu finden. Wie geht das?",

 {q:"Warum soll eine Maske beim Erstellen eher zu hart als zu weich sein?",

 {q:"Welche drei Methoden der Maskenherstellung unterscheidet man grundsätzlich?",

  e:"Manuell mit dem Pinsel eignet sich nur für kleine Flächen und ist meist am langsamsten. Automatisch berechnen klappt bei klaren Ton- und Farbunterschieden. Der Vektorpfad ist ideal für glatte Formen. Oft kombinierst du die Methoden."},
 {q:"Wann setzt du das Objektauswahlwerkzeug sinnvoll ein?",
  a:["Wenn das Resultat mal nicht perfekt sein muss oder man eine erste Grundlage braucht","Wenn der Freisteller später in eine Bildmontage kommt","Wenn ein Produkt mit glatten Rundungen sauber in den Druck geht","Wenn du aus der Auswahl direkt eine Vektormaske brauchst"],
  e:"Das Objektauswahlwerkzeug ist schnell, die Objektkanten werden aber zu ausgefranst. Für eine lokale Farbkorrektur mit leicht weicher Maske reicht das. Und als erste Grundlage, die du danach mit Schnellauswahl oder Pinsel verfeinerst, spart es Zeit. Für einen sauberen Freisteller allein reicht es nicht."},
 {q:"Grüne Palmblätter vor blauem Himmel. Welchen Kanal duplizierst du als Grundlage für die Maske?",fig:"kanaele",

 {q:"Welcher Freisteller wäre am schwierigsten zu realisieren?",

  e:"Weisser, durchsichtiger Stoff verschmilzt in Ton, Farbe und Struktur mit dem hellen Hintergrund. Da hilft kein Freistelltrick mehr, das wird eher Retusche oder Illustration. Das Smartphone ist trotz unruhigem Hintergrund einfach: klare Kanten, also Pfad. Achte darum schon beim Fotografieren oder bei der Bildwahl auf guten Kontrast."}

const ICON = {
  ok:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path class="zug" d="M7.2 12.4l3.3 3.3 6.4-6.6"/></svg>`,
  no:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path class="zug" d="M8.3 8.3l7.4 7.4M15.7 8.3l-7.4 7.4"/></svg>`
};
const AWARD = `<svg viewBox="0 0 140 140" role="img" aria-label="Stempel Freistell-Profi">
  <defs><path id="bo" d="M26 70 A44 44 0 0 1 114 70"/><path id="bu" d="M17 70 A53 53 0 0 0 123 70"/></defs>
  <circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="60" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text><textPath href="#bo" startOffset="50%" text-anchor="middle">Freistell-Profi</textPath></text>
  <text><textPath href="#bu" startOffset="50%" text-anchor="middle">gautschmich</textPath></text>
  <g transform="translate(70 70) scale(1.4) translate(-70 -70)">
    <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
      <circle cx="59" cy="87" r="6.5"/><circle cx="81" cy="87" r="6.5"/>
      <path d="M62.5 81.5 L84 49 M77.5 81.5 L56 49"/>
    </g>
    <circle cx="70" cy="70.2" r="1.3" fill="currentColor"/>
  </g>
</svg>`;
const L = ["A","B","C","D"];
const $ = s => document.querySelector(s);
const stage = $("#stage");
const shuffle = a => {const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
let st, run=0;
const fresh = idx => ({order:idx, i:0, ans:[], opts:idx.map(n=>shuffle([0,1,2,3]))});
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function head(){
  const n=st.order.length, done=st.ans.length, pts=st.ans.filter(a=>a.ok).length;
  $("#pos").innerHTML = st.i<n ? `Frage <b>${st.i+1}</b> von ${n}` : `Fertig: ${n} von ${n}`;
  $("#pts").textContent = pts===1 ? "1 Punkt" : pts+" Punkte";
  $("#fill").style.width = (done/n*100)+"%";
}
function show(){
  head();
  if(st.i>=st.order.length) return result();
  const qn=st.order[st.i], item=Q[qn], o=st.opts[st.i], given=st.ans[st.i];
  stage.innerHTML = `<div class="q">
    <h2 id="qt" tabindex="-1">${esc(item.q)}</h2>
    ${item.fig?`<div class="fig">${FIG[item.fig]}</div>`:""}
    <ol class="opts" aria-labelledby="qt">${o.map((k,j)=>{
      let cls="", m="";
      if(given){ if(k===0){cls="ok";m="Richtig"} else if(k===given.pick){cls="no";m="Deine Wahl"} else cls="dim"; }
      return `<li><button id="o${j}" class="${cls}" data-k="${k}" ${given?"disabled":""}><span class="k">${L[j]}</span><span class="t">${esc(item.a[k])}</span><span class="m">${m}</span></button></li>`}).join("")}</ol>
    ${given?`<div class="fb"><p class="v${given.seen?"":given.ok?" gut":" rot"}" aria-live="polite">${given.ok?ICON.ok:ICON.no}<span>${given.ok?"Richtig.":"Leider falsch."}</span></p>
      ${given.seen?`<p>${esc(item.e)}</p>${nextBtn()}`:`<p class="shine" id="ex">${esc(item.e)}</p>
      <div class="wait" id="wt"><div class="ring" role="timer" aria-label="Weiter in 12 Sekunden"><svg viewBox="0 0 44 44"><circle class="tr" cx="22" cy="22" r="20"/><circle class="pr" id="pr" cx="22" cy="22" r="20" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg><b id="sec">12</b></div><span class="hint">Lies die Erklärung, gleich geht es weiter.</span></div>`}</div>`:`<p class="hint" style="margin-top:14px">Tipp: Du kannst auch mit den Tasten A–D antworten.</p>`}
  </div>`;
  if(given && given.seen) $("#nx")?.focus({preventScroll:true});
  else if(given) reveal(item.e, given);
}
function nextBtn(){ return `<button class="next" id="nx">${st.i+1<st.order.length?"Nächste Frage →":"Zur Auswertung →"}</button>`; }
const WAIT = 12000, SHINE_AGAIN = 4000;
function reveal(text, given){
  const me = ++run, pr=$("#pr"), sec=$("#sec"), ex=$("#ex");
  // Glanz über den Text, nach 5 Sekunden ein zweites Mal, dazwischen normale Schrift
  ex.addEventListener("animationend",()=>ex.classList.remove("shine","again"));
  let again=false;
  // Runder Timer
  const t0=performance.now(), C=125.66;
  const tick=()=>{
    if(me!==run) return;
    const now=performance.now();
    const left=Math.max(0,WAIT-(now-t0));
    pr.setAttribute("stroke-dashoffset", (C*(1-left/WAIT)).toFixed(2));
    sec.textContent=Math.ceil(left/1000);
    if(!again && now-t0>=SHINE_AGAIN){ again=true; ex.classList.add("shine","again"); }
    if(left>0) setTimeout(tick,50);
    else {
      given.seen=true;
      const w=$("#wt"); w.outerHTML=nextBtn();
      $("#nx").focus({preventScroll:true});
    }
  };
  tick();
}
function pick(k){
  if(st.ans[st.i]) return;
  st.ans[st.i]={pick:k, ok:k===0};
  show();
  // Erklärung und Countdown ins Bild holen, falls sie unter dem Bildschirmrand liegen (v. a. mobil)
  const fb=document.querySelector(".fb");
  if(fb){ const still=matchMedia("(prefers-reduced-motion: reduce)").matches; requestAnimationFrame(()=>fb.scrollIntoView({block:"nearest",behavior:still?"auto":"smooth"})); }
}
function next(){ if(!st.ans[st.i]?.seen) return; st.i++; show(); window.scrollTo({top:0,behavior:"smooth"}); }
function result(){
  const n=st.order.length, pts=st.ans.filter(a=>a.ok).length, r=pts/n;
  const msg = r===1?"Alles richtig. Stark!": r>=.8?"Sehr gut, du kennst dich aus.": r>=.6?"Gut. Schau dir die falschen Antworten nochmals an.":"Da geht noch was. Lies die Erklärungen und versuch es nochmals.";
  const wrong=st.ans.map((a,j)=>a.ok?null:j).filter(x=>x!==null);
  stage.innerHTML = `<div class="q res">
    <h2>${pts} von ${n}</h2><p class="sub">${msg}</p>
    ${n===Q.length && pts>10 ? `<div class="award">${AWARD}<div><b>Auszeichnung: Freistell-Profi</b><p>${pts===n?"Volle Punktzahl. Du beherrschst die Grundlagen des Freistellens.":"Mehr als 10 Punkte. Du kennst die Grundlagen des Freistellens."}</p><p class="hint">Mach einen Screenshot, wenn du sie behalten willst.</p></div></div>` : ""}
    <div>${wrong.length?`<button class="next" id="rw">Nur falsche wiederholen</button>`:""}<button class="next" id="ra">Ganzes Quiz nochmals</button></div>
    <ol class="rev">${st.order.map((qn,j)=>{const a=st.ans[j];return `<li class="${a.ok?"":"wrong"}"><span class="n">${j+1}</span><span class="qq">${esc(Q[qn].q)}</span>
      <span class="a">${a.ok?"Richtig":`<span class="hint">Deine Antwort: ${esc(Q[qn].a[a.pick])}</span><br>Richtig: ${esc(Q[qn].a[0])}`}</span></li>`}).join("")}</ol>
  </div>`;
  const rw=$("#rw"); if(rw) rw.onclick=()=>{st=fresh(wrong.map(j=>st.order[j]));show()};
  $("#ra").onclick=()=>{st=fresh(Q.map((_,j)=>j));show()};
}
stage.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.k!==undefined) pick(+b.dataset.k);
  else if(b.id==="nx") next();
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase(), j=L.indexOf(k);
  if(st.i<st.order.length && !st.ans[st.i] && (j>=0||"1234".includes(k)&&k!=="")){
    const idx=j>=0?j:+k-1; const b=document.getElementById("o"+idx); if(b){e.preventDefault();b.click()}
  } else if(e.key==="Enter" && st.ans[st.i]?.seen && document.activeElement?.id!=="nx"){ e.preventDefault(); next(); }
});
const start = d => { st = d && d.order ? d : fresh(Q.map((_,j)=>j)); show(); };
window.claude?.hot?.snapshot?.(()=>st);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
