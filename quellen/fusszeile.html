<!-- gautschmi.ch Fusszeile: unverändert ans Ende jedes Lernmaterials setzen (innerhalb des Seitenrands, vor </body>) -->
<footer class="gm-fuss">
  <span><b>gautschmi.ch</b> Alle Angaben ohne Gewähr. Es gelten die jeweiligen Schullehrpläne.</span>
  <span class="gm-fuss-links"><a href="#" class="gm-fehler">Fehler melden</a><a href="https://gautschmi.ch/">zurück zu gautschmi.ch</a></span>
</footer>
<style>
.gm-fuss { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem 1.6rem; margin-top: 4rem; padding: .7rem 0 1.5rem; border-top: 1px solid currentColor; font-size: .85rem; line-height: 1.5; }
.gm-fuss b { font-weight: 700; }
.gm-fuss-links { display: flex; gap: 1.6rem; white-space: nowrap; }
.gm-fuss a { color: inherit; text-decoration: none; }
.gm-fuss a:hover { text-decoration: underline; text-underline-offset: .2em; }
</style>
<script>
/* Mailadresse erst beim Klick zusammensetzen, damit Bots sie nicht im Quelltext finden */
document.querySelectorAll(".gm-fehler").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var t = ["hc.zgfs", "lebonk.ocram"].map(function (s) { return s.split("").reverse().join(""); });
    location.href = "mailto:" + t[1] + String.fromCharCode(64) + t[0] + "?subject=" + encodeURIComponent("Fehler auf gautschmi.ch: " + document.title);
  });
});
</script>
